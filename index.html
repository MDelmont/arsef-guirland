<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notre guirlande</title>

  <style>

    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      overflow-x: hidden;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      color: #252525;

      background:
        radial-gradient(
          circle at 2% 28%,
          rgba(55, 210, 225, 0.13) 0,
          rgba(55, 210, 225, 0.13) 100px,
          transparent 230px
        ),

        radial-gradient(
          circle at 97% 48%,
          rgba(255, 65, 145, 0.10) 0,
          rgba(255, 65, 145, 0.10) 140px,
          transparent 300px
        ),

        radial-gradient(
          circle at 3% 72%,
          rgba(95, 215, 130, 0.10) 0,
          rgba(95, 215, 130, 0.10) 110px,
          transparent 260px
        ),

        #fffaf2;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .hero {
      position: relative;

      min-height: 250px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 50px 20px 35px;

      z-index: 10;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      margin: 0;

      font-size: clamp(
        42px,
        5.8vw,
        82px
      );

      font-weight: 900;

      line-height: 0.95;

      letter-spacing: -4px;
    }

    .hero p {
      margin: 24px 0 0;

      font-size: clamp(
        14px,
        1.3vw,
        19px
      );

      color: #777;

      font-weight: 400;
    }


    /* =========================================================
       GUIRLANDE
       ========================================================= */

    #garland {
      position: relative;

      width: 100%;

      min-height: 100vh;

      isolation: isolate;
    }


    /* =========================================================
       SVG DE LA CORDE
       ========================================================= */

    #rope-svg {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: visible;

      pointer-events: none;

      z-index: 1;
    }


    /*
      Grosse ombre douce sous la corde
    */

    .rope-big-shadow {
      fill: none;

      stroke: rgba(55, 31, 10, 0.15);

      stroke-width: 20;

      stroke-linecap: round;
      stroke-linejoin: round;

      transform: translateY(7px);

      filter: blur(4px);
    }


    /*
      Contour foncé donnant de la profondeur.
    */

    .rope-dark {
      fill: none;

      stroke: #75481e;

      stroke-width: 15;

      stroke-linecap: round;
      stroke-linejoin: round;

      filter: url(#ropeRoughness);
    }


    /*
      Corps principal.
    */

    .rope-main {
      fill: none;

      stroke: #c48a49;

      stroke-width: 11;

      stroke-linecap: round;
      stroke-linejoin: round;

      filter: url(#ropeRoughness);
    }


    /*
      Fibre sombre en pointillé.

      Les tirets suivent réellement la courbe.
    */

    .rope-fibre-dark {
      fill: none;

      stroke: rgba(80, 40, 12, 0.42);

      stroke-width: 3;

      stroke-dasharray: 4 7;

      stroke-linecap: round;

      filter: url(#ropeRoughness);
    }


    /*
      Deuxième fibre, légèrement décalée.
    */

    .rope-fibre-light {
      fill: none;

      stroke: rgba(255, 229, 184, 0.75);

      stroke-width: 2.2;

      stroke-dasharray: 7 6;

      stroke-dashoffset: 4;

      stroke-linecap: round;
    }


    /*
      Reflet supérieur.
    */

    .rope-highlight {
      fill: none;

      stroke: rgba(255, 240, 210, 0.55);

      stroke-width: 2;

      stroke-linecap: round;

      transform: translateY(-2px);
    }


    /* =========================================================
       FANIONS
       ========================================================= */

    .flag {
      position: absolute;

      width: clamp(
        105px,
        10vw,
        170px
      );

      height: auto;

      display: block;

      /*
        Le haut du fanion est fixé à la corde.
      */

      transform-origin:
        50% 2%;

      user-select: none;

      -webkit-user-drag: none;

      pointer-events: none;

      z-index: 4;

      opacity: 0;

      filter:
        drop-shadow(
          0 14px 10px
          rgba(0, 0, 0, 0.12)
        )
        drop-shadow(
          0 3px 2px
          rgba(0, 0, 0, 0.10)
        );

      transition:
        opacity 0.7s ease;
    }

    .flag.visible {
      opacity: 1;
    }


    /*
      Petit noeud au-dessus des fanions
    */

    .knot {
      position: absolute;

      width: 13px;
      height: 13px;

      border-radius: 50%;

      z-index: 6;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 35% 28%,
          #f2c17e 0,
          #bc7d35 35%,
          #75451c 76%,
          #48280e 100%
        );

      box-shadow:
        0 2px 3px
        rgba(0, 0, 0, 0.28);
    }


    /* =========================================================
       TACHES DE COULEUR DÉCORATIVES
       ========================================================= */

    .decor-blob {
      position: absolute;

      border-radius: 46% 54% 58% 42% /
                     52% 44% 56% 48%;

      z-index: 0;

      pointer-events: none;

      opacity: 0.075;

      filter: blur(1px);
    }


    /* =========================================================
       PETITES DÉCORATIONS
       ========================================================= */

    .spark {
      position: absolute;

      z-index: 0;

      pointer-events: none;

      width: 40px;
      height: 40px;

      opacity: 0.75;
    }

    .spark::before,
    .spark::after {
      content: "";

      position: absolute;

      width: 5px;
      height: 22px;

      border-radius: 20px;

      background: currentColor;
    }

    .spark::before {
      left: 7px;
      top: 10px;

      transform:
        rotate(-25deg);
    }

    .spark::after {
      right: 7px;
      top: 3px;

      transform:
        rotate(20deg);
    }


    /* =========================================================
       SCROLL INDICATOR
       ========================================================= */

    .scroll-hint {
      position: fixed;

      right: 22px;
      bottom: 22px;

      z-index: 50;

      display: flex;

      align-items: center;

      gap: 10px;

      padding:
        11px
        16px;

      border-radius: 100px;

      background:
        rgba(255, 255, 255, 0.78);

      border:
        1px solid
        rgba(0, 0, 0, 0.055);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);

      font-size: 14px;

      font-weight: 700;
    }

    .scroll-hint-arrow {
      font-size: 19px;

      animation:
        scrollBounce
        1.5s
        infinite
        ease-in-out;
    }

    @keyframes scrollBounce {

      0%,
      100% {
        transform:
          translateY(-3px);
      }

      50% {
        transform:
          translateY(4px);
      }

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media
    (
      max-width: 700px
    ) {

      .hero {
        min-height: 190px;

        padding:
          35px
          18px;
      }

      .hero h1 {
        letter-spacing:
          -2px;
      }

      .scroll-hint {
        right: 10px;
        bottom: 10px;

        font-size: 12px;

        padding:
          9px
          13px;
      }

    }


  </style>
</head>


<body>


  <!-- =======================================================
       ENTÊTE
       ======================================================= -->

  <header class="hero">

    <div class="hero-content">

      <h1>
        Notre guirlande
      </h1>

      <p>
        Faites défiler pour découvrir tous les fanions
      </p>

    </div>

  </header>



  <!-- =======================================================
       GUIRLANDE
       ======================================================= -->

  <main id="garland">


    <!--
      Toute la corde est UN SEUL SVG
      et UN SEUL chemin continu.
    -->

    <svg
      id="rope-svg"
      preserveAspectRatio="none"
    >

      <defs>

        <!--
          Donne une très légère irrégularité
          aux bords de la corde.
        -->

        <filter
          id="ropeRoughness"
          x="-10%"
          y="-10%"
          width="120%"
          height="120%"
        >

          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.012 0.20"
            numOctaves="2"
            seed="7"
            result="noise"
          />

          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="1.4"
            xChannelSelector="R"
            yChannelSelector="G"
          />

        </filter>

      </defs>


      <!-- Ombre -->

      <path
        id="rope-big-shadow"
        class="rope-big-shadow"
      ></path>


      <!-- Corps foncé -->

      <path
        id="rope-dark"
        class="rope-dark"
      ></path>


      <!-- Corps principal -->

      <path
        id="rope-main"
        class="rope-main"
      ></path>


      <!-- Fibres -->

      <path
        id="rope-fibre-dark"
        class="rope-fibre-dark"
      ></path>

      <path
        id="rope-fibre-light"
        class="rope-fibre-light"
      ></path>


      <!-- Reflet -->

      <path
        id="rope-highlight"
        class="rope-highlight"
      ></path>

    </svg>

  </main>



  <div class="scroll-hint">

    <span>
      Découvrir
    </span>

    <span class="scroll-hint-arrow">
      ↓
    </span>

  </div>



<script>

  /* ==========================================================
     CONFIGURATION À MODIFIER
     ========================================================== */


  /*
     NOMBRE TOTAL DE FANIONS

     Exemple :
     si tu as :

     001.png
     002.png
     ...
     153.png

     mets :

     const TOTAL_FANIONS = 153;
  */

  const TOTAL_FANIONS = 12;


  /*
     EXTENSION DE TES IMAGES

     PNG recommandé car cela permet
     d'avoir un fond transparent.

     Tu peux mettre :

     "png"
     "webp"
     "jpg"
  */

  const FANION_EXTENSION = "png";


  /*
     Dossier dans lequel sont stockés
     les scans.
  */

  const FANION_FOLDER = "fanions";


  /*
     Génération automatique :

     fanions/001.png
     fanions/002.png
     fanions/003.png
     ...
  */

  const FANIONS =
    Array.from(
      {
        length:
          TOTAL_FANIONS
      },

      (_, index) => {

        const number =
          String(
            index + 1
          )
          .padStart(
            3,
            "0"
          );

        return (
          `${FANION_FOLDER}/` +
          `${number}.` +
          `${FANION_EXTENSION}`
        );

      }
    );


  /* ==========================================================
     DOM
     ========================================================== */

  const garland =
    document.querySelector(
      "#garland"
    );

  const ropeSvg =
    document.querySelector(
      "#rope-svg"
    );


  const ropePaths = [

    document.querySelector(
      "#rope-big-shadow"
    ),

    document.querySelector(
      "#rope-dark"
    ),

    document.querySelector(
      "#rope-main"
    ),

    document.querySelector(
      "#rope-fibre-dark"
    ),

    document.querySelector(
      "#rope-fibre-light"
    ),

    document.querySelector(
      "#rope-highlight"
    )

  ];


  /* ==========================================================
     CRÉATION DES IMAGES
     ========================================================== */

  const flagElements = [];

  const knotElements = [];


  FANIONS.forEach(
    (
      source,
      index
    ) => {

      const img =
        document.createElement(
          "img"
        );


      img.src =
        source;


      img.alt =
        `Fanion ${index + 1}`;


      img.className =
        "flag";


      img.loading =
        index < 15
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      /*
        Si un fichier est absent,
        on le masque au lieu d'afficher
        le petit symbole d'image cassée.
      */

      img.addEventListener(
        "error",
        () => {

          console.warn(
            `Image introuvable : ${source}`
          );

          img.style.visibility =
            "hidden";

        }
      );


      /*
        Petit noeud visuel.
      */

      const knot =
        document.createElement(
          "div"
        );


      knot.className =
        "knot";


      garland.appendChild(
        img
      );


      garland.appendChild(
        knot
      );


      flagElements.push(
        img
      );


      knotElements.push(
        knot
      );

    }
  );


  /* ==========================================================
     UTILITAIRE SVG
     ========================================================== */

  const SVG_NS =
    "http://www.w3.org/2000/svg";


  function createTemporaryPath(
    d
  ) {

    const temp =
      document.createElementNS(
        SVG_NS,
        "path"
      );


    temp.setAttribute(
      "d",
      d
    );


    temp.setAttribute(
      "fill",
      "none"
    );


    ropeSvg.appendChild(
      temp
    );


    return temp;

  }


  /* ==========================================================
     DÉCORATIONS DE FOND
     ========================================================== */

  function clearDecorations() {

    garland
      .querySelectorAll(
        ".decor-blob, .spark"
      )
      .forEach(
        element => {

          element.remove();

        }
      );

  }


  function createDecorations(
    rowCount,
    rowGap
  ) {

    clearDecorations();


    const colors = [

      "#ff2f8b",
      "#00bed8",
      "#4bd269",
      "#ffd51e",
      "#7258ff"

    ];


    for (
      let row = 0;
      row < rowCount;
      row++
    ) {

      /*
        Grande tache pastel.
      */

      const blob =
        document.createElement(
          "div"
        );


      blob.className =
        "decor-blob";


      const size =
        220 +
        (
          row % 3
        ) *
        70;


      blob.style.width =
        `${size}px`;


      blob.style.height =
        `${size * 0.8}px`;


      blob.style.background =
        colors[
          row %
          colors.length
        ];


      blob.style.top =
        `${
          50 +
          row * rowGap +
          40
        }px`;


      if (
        row % 2 === 0
      ) {

        blob.style.left =
          "-100px";

      } else {

        blob.style.right =
          "-100px";

      }


      garland.appendChild(
        blob
      );


      /*
        Petit accent graphique.
      */

      const spark =
        document.createElement(
          "div"
        );


      spark.className =
        "spark";


      spark.style.color =
        colors[
          (
            row +
            3
          ) %
          colors.length
        ];


      spark.style.top =
        `${
          row *
          rowGap +
          rowGap *
          0.25
        }px`;


      if (
        row % 2 === 0
      ) {

        spark.style.right =
          "5%";

      } else {

        spark.style.left =
          "5%";

      }


      garland.appendChild(
        spark
      );

    }

  }


  /* ==========================================================
     CALCUL DE L'ANGLE DE LA CORDE
     ========================================================== */

  function getAngleAtLength(
    path,
    length
  ) {

    const totalLength =
      path.getTotalLength();


    const before =
      path.getPointAtLength(
        Math.max(
          0,
          length - 2
        )
      );


    const after =
      path.getPointAtLength(
        Math.min(
          totalLength,
          length + 2
        )
      );


    return (
      Math.atan2(
        after.y - before.y,
        after.x - before.x
      )
      *
      180
      /
      Math.PI
    );

  }


  /* ==========================================================
     CONSTRUCTION DE LA GUIRLANDE
     ========================================================== */

  function buildGarland() {


    const width =
      document.documentElement
        .clientWidth;


    /*
      Taille approximative d'un fanion.

      Doit suivre la valeur CSS :
      clamp(105px, 10vw, 170px)
    */

    const flagWidth =
      Math.min(
        170,

        Math.max(
          105,
          width * 0.10
        )
      );


    /*
      On veut que les fanions se touchent
      presque.
    */

    const flagSpacing =
      flagWidth * 0.96;


    /*
      Marge latérale.

      La corde peut légèrement sortir
      du viewport lors du demi-tour.
    */

    const sideMargin =
      width < 600
        ? 18
        : Math.max(
            45,
            width * 0.045
          );


    const usableWidth =
      width -
      (
        sideMargin *
        2
      );


    /*
      Nombre de fanions sur une ligne.
    */

    const flagsPerRow =
      Math.max(
        3,

        Math.floor(
          usableWidth /
          flagSpacing
        )
      );


    /*
      Nombre de rangées nécessaires.
    */

    const rowCount =
      Math.ceil(
        TOTAL_FANIONS /
        flagsPerRow
      );


    /*
      Espace vertical.

      Plus important que dans ta
      première version pour mieux
      respirer.
    */

    const rowGap =
      width < 600
        ? 245
        : 350;


    const topOffset =
      width < 600
        ? 70
        : 100;


    /*
      Creux naturel de chaque portion
      horizontale.
    */

    const sag =
      width < 600
        ? 20
        : 34;


    const bottomSpace =
      width < 600
        ? 200
        : 300;


    const totalHeight =
      topOffset +
      (
        rowCount *
        rowGap
      ) +
      bottomSpace;


    garland.style.height =
      `${totalHeight}px`;


    ropeSvg.setAttribute(
      "viewBox",
      `0 0 ${width} ${totalHeight}`
    );


    /*
      On remet les fanions à zéro.
    */

    flagElements.forEach(
      flag => {

        flag.style.left =
          "0px";

        flag.style.top =
          "0px";

      }
    );


    knotElements.forEach(
      knot => {

        knot.style.left =
          "0px";

        knot.style.top =
          "0px";

      }
    );


    /*
      CHEMIN GLOBAL

      Il s'agit réellement d'un seul
      tracé SVG continu.
    */

    let globalPath =
      "";


    let globalFlagIndex =
      0;


    /*
      Position du début.
    */

    let previousEndX =
      null;

    let previousY =
      null;


    for (
      let row = 0;
      row < rowCount;
      row++
    ) {


      const leftToRight =
        row % 2 === 0;


      const remaining =
        TOTAL_FANIONS -
        globalFlagIndex;


      const flagsThisRow =
        Math.min(
          flagsPerRow,
          remaining
        );


      const y =
        topOffset +
        row *
        rowGap;


      /*
        Pour toutes les lignes sauf
        la dernière, on utilise toute
        la largeur.

        C'est ce qui permet d'avoir
        des demi-tours cohérents.
      */

      const isLastRow =
        row ===
        rowCount - 1;


      const startX =
        leftToRight

          ? sideMargin

          : width -
            sideMargin;


      let endX;


      if (
        isLastRow
      ) {

        /*
          La dernière ligne peut
          s'arrêter avant le bord
          s'il reste peu de fanions.
        */

        const distance =
          Math.min(

            usableWidth,

            Math.max(
              flagSpacing,
              (
                flagsThisRow -
                1
              ) *
              flagSpacing
            )

          );


        endX =
          leftToRight

            ? startX +
              distance

            : startX -
              distance;

      } else {

        endX =
          leftToRight

            ? width -
              sideMargin

            : sideMargin;

      }


      /*
        PREMIÈRE LIGNE
      */

      if (
        row === 0
      ) {

        globalPath +=
          `M ${startX} ${y} `;

      }


      /*
        Demi-tour depuis la ligne
        précédente.
      */

      if (
        row > 0
      ) {

        const direction =
          previousEndX >
          width / 2

            ? 1

            : -1;


        /*
          La corde sort légèrement du
          cadre pour créer un beau
          virage naturel.
        */

        const outsideX =
          previousEndX +
          direction *
          (
            width < 600
              ? 27
              : 45
          );


        globalPath += `

          C

          ${outsideX}
          ${
            previousY +
            rowGap *
            0.20
          }

          ${outsideX}
          ${
            y -
            rowGap *
            0.20
          }

          ${startX}
          ${y}

        `;

      }


      /*
        Courbe de la rangée.

        Quadratique :
        début → centre bas → fin
      */

      const centerX =
        (
          startX +
          endX
        ) /
        2;


      const controlY =
        y +
        sag *
        2;


      const rowPathD =
        `M ${startX} ${y}
         Q
         ${centerX}
         ${controlY}
         ${endX}
         ${y}`;


      /*
        On ajoute cette courbe au
        chemin global.
      */

      globalPath += `

        Q

        ${centerX}
        ${controlY}

        ${endX}
        ${y}

      `;


      /*
        Création temporaire d'un path
        pour obtenir les vraies
        positions sur la courbe.
      */

      const temporaryPath =
        createTemporaryPath(
          rowPathD
        );


      const rowLength =
        temporaryPath
          .getTotalLength();


      /*
        Placement des fanions.
      */

      for (
        let localIndex = 0;
        localIndex < flagsThisRow;
        localIndex++
      ) {


        let ratio;


        /*
          On répartit les fanions sur
          toute la ligne.

          La dernière ligne incomplète
          reste naturellement plus
          courte.
        */

        if (
          flagsThisRow <= 1
        ) {

          ratio =
            0;

        } else {

          ratio =
            localIndex /
            (
              flagsThisRow -
              1
            );

        }


        const distance =
          ratio *
          rowLength;


        const point =
          temporaryPath
            .getPointAtLength(
              distance
            );


        let angle =
          getAngleAtLength(
            temporaryPath,
            distance
          );


        /*
          Quand on va de droite à
          gauche, l'angle SVG est proche
          de 180°.

          On ramène l'inclinaison
          autour de zéro.
        */

        if (
          !leftToRight
        ) {

          if (
            angle > 90
          ) {

            angle -=
              180;

          }

          if (
            angle < -90
          ) {

            angle +=
              180;

          }

        }


        const flag =
          flagElements[
            globalFlagIndex
          ];


        const knot =
          knotElements[
            globalFlagIndex
          ];


        /*
          Petit défaut naturel.

          Les fanions ne sont pas tous
          parfaitement droits.
        */

        const naturalTilt =
          (
            (
              globalFlagIndex %
              5
            ) -
            2
          ) *
          0.7;


        flag.style.left =
          `${point.x}px`;


        flag.style.top =
          `${point.y - 1}px`;


        flag.style.transform =
          `
            translateX(-50%)
            rotate(
              ${
                angle +
                naturalTilt
              }deg
            )
          `;


        /*
          Petit noeud sur la corde.
        */

        knot.style.left =
          `${point.x - 6.5}px`;


        knot.style.top =
          `${point.y - 6}px`;


        globalFlagIndex++;


      }


      /*
        Suppression du path temporaire.
      */

      temporaryPath.remove();


      previousEndX =
        endX;


      previousY =
        y;

    }


    /*
      Le même chemin est utilisé
      par toutes les couches de
      la corde.
    */

    ropePaths.forEach(
      path => {

        path.setAttribute(
          "d",
          globalPath
        );

      }
    );


    /*
      Décor.
    */

    createDecorations(
      rowCount,
      rowGap
    );


    /*
      Apparition au scroll.
    */

    observeFlags();

  }


  /* ==========================================================
     APPARITION AU SCROLL
     ========================================================== */

  let observer =
    null;


  function observeFlags() {


    if (
      observer
    ) {

      observer.disconnect();

    }


    observer =
      new IntersectionObserver(

        entries => {

          entries.forEach(
            entry => {

              if (
                entry.isIntersecting
              ) {

                entry
                  .target
                  .classList
                  .add(
                    "visible"
                  );

              }

            }
          );

        },

        {
          rootMargin:
            "100px 0px 150px 0px",

          threshold:
            0.01
        }

      );


    flagElements.forEach(
      flag => {

        observer.observe(
          flag
        );

      }
    );

  }


  /* ==========================================================
     REDIMENSIONNEMENT
     ========================================================== */

  let resizeTimeout;


  window.addEventListener(
    "resize",
    () => {

      clearTimeout(
        resizeTimeout
      );


      resizeTimeout =
        setTimeout(
          () => {

            buildGarland();

          },
          150
        );

    }
  );


  /* ==========================================================
     LANCEMENT
     ========================================================== */

  buildGarland();


</script>
